name: Build AfriHospital

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore AfriHospital.csproj
      - name: Build
        run: dotnet build AfriHospital.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/AfriHospital.UnitTests/AfriHospital.UnitTests.csproj --configuration Release
